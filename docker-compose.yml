services:
  redis:
    image: redis:7-alpine
    container_name: optillm_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  db:
    image: postgres:15-alpine
    container_name: optillm_db
    environment:
      POSTGRES_USER: optillm
      POSTGRES_PASSWORD: password
      POSTGRES_DB: optillmdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U optillm -d optillmdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  optillm:
    build:
      context: .
      dockerfile: Dockerfile
    # No container_name / fixed host port here — both are incompatible with
    # `--scale optillm=N` (names collide, and multiple containers can't bind
    # the same host port). The nginx service below is what's actually
    # published on the host; see docs/deployment.md for the validated
    # multi-replica setup.
    expose:
      - "8000"
    environment:
      - DATABASE_URL=postgresql://optillm:password@db:5432/optillmdb
      - REDIS_URL=redis://redis:6379/0
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  nginx:
    image: nginx:1.27-alpine
    container_name: optillm_nginx
    ports:
      - "8000:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      optillm:
        condition: service_healthy
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.50.0
    container_name: optillm_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    depends_on:
      optillm:
        condition: service_healthy
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.3.3
    container_name: optillm_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboard.json:/etc/grafana/dashboards/dashboard.json:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
