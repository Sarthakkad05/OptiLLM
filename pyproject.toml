[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "optillm-client"
version = "1.0.0"
description = "AI Gateway Client SDK & CLI for OptiLLM"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
]

[project.scripts]
optillm = "optillm_client.cli:main"
