apiVersion: apps/v1
kind: Deployment
metadata:
  name: optillm-gateway
  namespace: default
  labels:
    app: optillm-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: optillm-gateway
  template:
    metadata:
      labels:
        app: optillm-gateway
    spec:
      containers:
        - name: optillm
          image: optillm/gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: APP_ENV
              value: "production"
            - name: ROUTING_STRATEGY
              value: "cost_optimized"
            - name: ROUTING_MODE
              value: "shadow"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
