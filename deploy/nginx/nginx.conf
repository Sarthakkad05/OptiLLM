worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Docker's embedded DNS server — re-resolving "optillm" here on every
    # request is what makes round-robin across scaled replicas work; a
    # static `upstream {}` block would freeze in on whichever container IPs
    # existed at nginx startup.
    resolver 127.0.0.11 valid=5s;

    access_log off;

    server {
        listen 80;

        location / {
            set $upstream http://optillm:8000;
            proxy_pass $upstream;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Exposed so a load test can confirm requests actually landed on
            # different replica containers, not just that the LB responded.
            add_header X-Upstream-Addr $upstream_addr always;

            proxy_connect_timeout 5s;
            proxy_read_timeout 120s;
        }
    }
}
